[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
ureq = "2.9"            # small blocking HTTP client
roxmltree = "0.19"      # read-only XML parser
thiserror = "1"         # ergonomic error enums
dirs = "5"              # cross-platform home / appdata paths
zip = { version = "0.6", default-features = false, features = ["deflate"] }
sha1 = "0.10"           # checksum verification
hex = "0.4"
sysinfo = "0.39"        # RAM and free disk space
serde = { version = "1", features = ["derive"] }  # so types can cross into JS later
